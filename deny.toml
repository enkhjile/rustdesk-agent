[advisories]
ignore = []

[licenses]
# HTTP/TLS dependencies also use ISC, BSD, Zlib and permissively licensed root data.
allow = ["MIT", "Apache-2.0", "Unicode-3.0", "ISC", "BSD-3-Clause", "Zlib", "CDLA-Permissive-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
