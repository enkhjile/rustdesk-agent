name: CI

on:
  push:
    branches: [main, alpha]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Windows x64 checks
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test
        run: |
          cargo test --locked
      - name: Build
        run: cargo build --locked --release --target x86_64-pc-windows-msvc --no-default-features
      - name: Installer lifecycle
        shell: powershell
        run: |
          $fixture = Join-Path ([Environment]::GetFolderPath('ProgramFiles')) 'RustDeskInstallerFixture'
          if (Test-Path $fixture) { throw 'Fixture path already exists' }
          New-Item -ItemType Directory $fixture | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/rustdesk-agent.exe "$fixture\rustdesk.exe"
          # This placeholder is never executed: these CI service checks stay stopped.
          ./tests/installer.ps1 -AgentPath (Resolve-Path target/x86_64-pc-windows-msvc/release/rustdesk-agent.exe).Path -RustDeskPath "$fixture\rustdesk.exe"
      - name: Generate dependency notices
        shell: pwsh
        run: |
          $tool = Join-Path $env:RUNNER_TEMP 'cargo-about'
          New-Item -ItemType Directory $tool | Out-Null
          Invoke-WebRequest https://github.com/EmbarkStudios/cargo-about/releases/download/0.9.3/cargo-about-0.9.3-x86_64-pc-windows-msvc.tar.gz -OutFile "$tool/about.tar.gz"
          if ((Get-FileHash "$tool/about.tar.gz").Hash -ne '9e2942533ef1c592c4a70bdb384cae1550a3f5fc9ae40379b6662e3d2f16fe02') { throw 'cargo-about checksum mismatch' }
          tar -xf "$tool/about.tar.gz" -C $tool
          if ($LASTEXITCODE -ne 0) { throw 'Cannot extract cargo-about' }
          & "$tool/cargo-about-0.9.3-x86_64-pc-windows-msvc/cargo-about.exe" generate --locked --no-default-features --fail scripts/notices.hbs -o target/THIRD-PARTY-NOTICES.txt
          if ($LASTEXITCODE -ne 0) { throw 'License notice generation failed' }
      - name: Prepare unsigned package
        shell: pwsh
        run: ./scripts/package.ps1 -BinaryPath target/x86_64-pc-windows-msvc/release/rustdesk-agent.exe -NoticesPath target/THIRD-PARTY-NOTICES.txt -OutputDirectory "$env:RUNNER_TEMP/unsigned-package"
      - name: Verify package integrity
        shell: pwsh
        run: ./tests/package.ps1 -ZipPath "$env:RUNNER_TEMP/unsigned-package/distribution/rustdesk-agent-windows-x64-unsigned.zip" -ExpectedCommit (git rev-parse HEAD) -ExpectedBinarySha256 (Get-FileHash target/x86_64-pc-windows-msvc/release/rustdesk-agent.exe).Hash
      - name: Upload unsigned package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rustdesk-agent-windows-x64-${{ github.sha }}
          path: ${{ runner.temp }}/unsigned-package/distribution/
          if-no-files-found: error
          retention-days: 7

  dependencies:
    name: Dependency checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          arguments: --locked --all-features

  release:
    name: GitHub release
    needs: [check, dependencies]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/alpha')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: rustdesk-agent-windows-x64-${{ github.sha }}
          path: dist
      - name: Verify checked package
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          test "$(unzip -p rustdesk-agent-windows-x64-unsigned.zip build.json | jq -r .source_commit)" = "$GITHUB_SHA"
      - name: Semantic release
        uses: cycjimmy/semantic-release-action@d9bf53a078bd2f86aaffaec796dbb3d28f1b6f34 # v8.1.3
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
