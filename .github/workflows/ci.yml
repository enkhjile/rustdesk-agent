name: CI

on:
  push:
    branches: [main, alpha]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Windows x64 checks
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test
        run: |
          cargo test --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --features lab-apply
      - name: Build
        run: cargo build --locked --release --target x86_64-pc-windows-msvc --no-default-features
      - name: Installer lifecycle
        shell: powershell
        run: |
          $fixture = Join-Path ([Environment]::GetFolderPath('ProgramFiles')) 'RustDeskInstallerFixture'
          if (Test-Path $fixture) { throw 'Fixture path already exists' }
          New-Item -ItemType Directory $fixture | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/rustdesk-agent.exe "$fixture\rustdesk.exe"
          # This placeholder is never executed: these CI service checks stay stopped.
          ./tests/installer.ps1 -AgentPath (Resolve-Path target/x86_64-pc-windows-msvc/release/rustdesk-agent.exe).Path -RustDeskPath "$fixture\rustdesk.exe"
      - name: Prepare test package
        shell: pwsh
        run: |
          $package = 'target/ci-test-package'
          New-Item -ItemType Directory $package -ErrorAction Stop | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/rustdesk-agent.exe $package
          Copy-Item scripts/install.ps1 $package
          Copy-Item docs/ci-test-package.md "$package/README.md"
          $source = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Cannot identify checked-out source' }
          $compiler = rustc --version
          if ($LASTEXITCODE -ne 0) { throw 'Cannot identify Rust compiler' }
          [ordered]@{
            source_commit = $source
            workflow_run = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            run_attempt = $env:GITHUB_RUN_ATTEMPT
            target = 'x86_64-pc-windows-msvc'
            profile = 'release'
            features = @()
            rustc = $compiler
          } | ConvertTo-Json | Set-Content "$package/build.json" -Encoding utf8
          @('rustdesk-agent.exe', 'install.ps1', 'README.md', 'build.json') | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash "$package/$_" -Algorithm SHA256).Hash.ToLowerInvariant(), $_
          } | Set-Content "$package/SHA256SUMS" -Encoding ascii
      - name: Upload test package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rustdesk-agent-test-windows-x64-${{ github.sha }}
          path: target/ci-test-package/
          if-no-files-found: error
          retention-days: 7

  dependencies:
    name: Dependency checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          arguments: --locked --all-features

  release:
    name: GitHub release
    needs: [check, dependencies]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/alpha')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Semantic release
        uses: cycjimmy/semantic-release-action@d9bf53a078bd2f86aaffaec796dbb3d28f1b6f34 # v8.1.3
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
