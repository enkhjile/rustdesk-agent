[package]
name = "rustdesk-agent"
version = "0.0.0-development"
edition = "2024"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
url = { version = "2", features = ["serde"] }
zeroize = { version = "1", features = ["serde"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
httpdate = "1"

[dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
axum-server = { version = "0.9", features = ["tls-rustls-no-provider"] }
jsonschema = { version = "0.60", default-features = false }
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "process", "io-util", "sync"] }

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
tokio = { version = "1", features = ["rt", "process", "io-util", "time", "sync", "macros"] }

windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_Shell"] }
