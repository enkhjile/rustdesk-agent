[package]
name = "rustdesk-agent"
version = "0.0.0-development"
edition = "2024"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
axum-server = { version = "0.9", features = ["tls-rustls-no-provider"] }
jsonschema = { version = "0.60", default-features = false }
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
